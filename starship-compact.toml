"$schema" = 'https://starship.rs/config-schema.json'


format = "$directory${custom.sep_sem_git}$git_branch$git_status${custom.fim_git} "


palette = 'gruvbox_dark'


[palettes.gruvbox_dark]
color_fg0 = '#fbf1c7'
color_aqua = '#689d6a'
color_yellow = '#d79921'


[directory]
style = "fg:color_fg0 bg:color_yellow"
format = "[ $path ]($style)"
truncation_length = 1
truncation_symbol = ""


[git_branch]
symbol = ""
style = "bg:color_aqua"
truncation_length = 18
truncation_symbol = "…"
format = "[](fg:color_yellow bg:color_aqua)[ $branch ](fg:color_fg0 bg:color_aqua)"


[git_status]
style = "bg:color_aqua"
format = '[[($all_status$ahead_behind )](fg:color_fg0 bg:color_aqua)]($style)'


[custom.sep_sem_git]
description = "Seta amarela quando fora de um repo git"
when = "! git rev-parse --is-inside-work-tree >/dev/null 2>&1"
shell = ["bash", "--noprofile", "--norc"]
format = "[](fg:color_yellow)"


[custom.fim_git]
description = "Seta final verde dentro de um repo git"
when = true
require_repo = true
shell = ["bash", "--noprofile", "--norc"]
format = "[](fg:color_aqua)"
