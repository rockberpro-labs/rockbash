"$schema" = 'https://starship.rs/config-schema.json'


# Prompt curto (~40 colunas): diretório atual + branch (truncada) e status do git.
format = "$directory${custom.sep_sem_git}$git_branch$git_status${custom.fim_git} "


palette = 'gruvbox_dark'


[palettes.gruvbox_dark]
color_fg0 = '#fbf1c7'
color_aqua = '#689d6a'
color_teal = '#2a8c8c'


[directory]
style = "fg:color_fg0 bg:color_teal"
format = "[ $path ]($style)"
truncation_length = 1
truncation_symbol = ""
truncate_to_repo = false


[git_branch]
symbol = ""
style = "bg:color_aqua"
truncation_length = 18
truncation_symbol = "…"
format = "[](fg:color_teal bg:color_aqua)[ $branch ](fg:color_fg0 bg:color_aqua)"


[git_status]
style = "bg:color_aqua"
format = '[[($all_status$ahead_behind )](fg:color_fg0 bg:color_aqua)]($style)'


[custom.sep_sem_git]
description = "Seta amarela quando fora de um repo git"
when = "! git rev-parse --is-inside-work-tree >/dev/null 2>&1"
shell = ["bash", "--noprofile", "--norc"]
format = "[](fg:color_teal)"


[custom.fim_git]
description = "Seta final verde dentro de um repo git"
when = true
require_repo = true
shell = ["bash", "--noprofile", "--norc"]
format = "[](fg:color_aqua)"
